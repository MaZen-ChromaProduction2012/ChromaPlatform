<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة المونتير — ChromaProduction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <nav class="border-b border-slate-800 bg-slate-900 px-6 py-4 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-purple-600 flex items-center justify-center text-white font-bold">CP</div>
      <span class="font-bold text-lg text-white">مساحة عمل المونتير</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="usernameDisplay" class="text-sm text-slate-400 font-semibold"></span>
      <button onclick="logout()" class="text-sm text-red-400 hover:text-red-300 font-bold px-3 py-1.5 rounded-lg border border-red-500/20 hover:bg-red-500/10 transition">خروج</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-6 space-y-6">
    <div class="bg-gradient-to-r from-blue-900/40 to-purple-900/40 border border-blue-500/30 rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-2xl"><i class="fa-brands fa-telegram"></i></div>
        <div>
          <h3 class="font-bold text-white text-base">ربط بوت التيليجرام المساعد الشخصي</h3>
          <p class="text-xs text-slate-300">حدث حالات شغلك بصوتك أو بكتابة رسائل سريعة من الموبايل بدون فتح المتصفح</p>
        </div>
      </div>
      <span class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg text-blue-400 font-mono">أوامر سريعة: 'طلب 1 خلصت الصوت'</span>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
        <i class="fa-solid fa-film text-purple-400"></i> طلبات المونتاج المسندة والمتاحة
      </h2>
      <div id="editorOrders" class="space-y-4">
        <p class="text-slate-500 text-sm text-center py-8">جاري جلب الطلبات...</p>
      </div>
    </div>
  </main>

  <script>
    async function checkAuth() {
      const res = await fetch('/api/auth/current-user');
      const data = await res.json();
      if (!data.authenticated || (data.user.role !== 'editor' && data.user.role !== 'admin')) {
        window.location.href = '/login';
      }
      document.getElementById('usernameDisplay').textContent = 'المونتير: ' + data.user.username;
    }

    async function loadOrders() {
      const res = await fetch('/api/orders');
      const data = await res.json();
      const container = document.getElementById('editorOrders');

      if (!data.orders || data.orders.length === 0) {
        container.innerHTML = '<div class="text-center py-10 text-slate-500 text-sm">لا توجد مشاريع حالياً.</div>';
        return;
      }

      container.innerHTML = data.orders.map(o => `
        <div class="p-5 rounded-2xl bg-slate-800/50 border border-slate-700/60 grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
          <div class="md:col-span-2">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs font-bold text-purple-400">طلب #${o.id}</span>
              <span class="text-xs text-slate-400">• العميل: ${o.client_name}</span>
            </div>
            <h3 class="text-base font-bold text-white">${o.title}</h3>
            <p class="text-xs text-slate-400 mt-1"><strong class="text-slate-300">الحالة الحالية:</strong> ${o.status_text} (${o.progress}%)</p>
          </div>

          <div class="flex items-center gap-2">
            ${o.file_name ? `
              <a href="/api/orders/${o.id}/download-zip" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl transition flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-file-zipper"></i> تحميل الخام
              </a>
            ` : '<span class="text-xs text-slate-500">لا يوجد ملف مرفوع</span>'}
          </div>

          <div class="flex items-center gap-2">
            <select onchange="updateStatus(${o.id}, this.value)" class="bg-slate-700 text-xs text-white rounded-xl px-3 py-2 border border-slate-600 focus:outline-none">
              <option value="" disabled selected>تغيير الحالة...</option>
              <option value="downloading">جاري تحميل وفرز الخام (25%)</option>
              <option value="rough_cut">التقطيع الأولي (45%)</option>
              <option value="audio_sync">ضبط الصوت والموسيقى (65%)</option>
              <option value="color_grade">تصحيح الألوان (80%)</option>
              <option value="vfx">موشن جرافيك ومؤثرات (90%)</option>
              <option value="in_review">جاهز للمعاينة (95%)</option>
              <option value="completed">تم التسليم النهائي (100%)</option>
            </select>
          </div>
        </div>
      `).join('');
    }

    async function updateStatus(orderId, status) {
      const res = await fetch(`/api/orders/${orderId}/update-status`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ status })
      });
      if (res.ok) {
        loadOrders();
      } else alert('حدث خطأ أثناء التحديث');
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    }

    checkAuth();
    loadOrders();
  </script>
</body>
</html>
