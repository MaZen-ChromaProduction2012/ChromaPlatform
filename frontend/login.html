<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — ChromaProduction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-bold text-2xl mx-auto shadow-lg shadow-blue-500/20 mb-4">CP</div>
      <h2 class="text-2xl font-bold text-white">تسجيل الدخول</h2>
      <p class="text-slate-400 text-sm mt-1">أهلاً بك مجدداً في منصة ChromaProduction</p>
    </div>

    <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-sm"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-1.5">اسم المستخدم أو البريد</label>
        <input type="text" id="identifier" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-blue-500 transition">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-1.5">كلمة المرور</label>
        <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-blue-500 transition">
      </div>
      <button type="submit" class="w-full py-3.5 rounded-xl font-bold bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-600/30 transition mt-2">
        دخول
      </button>
    </form>

    <p class="text-center text-sm text-slate-400 mt-6">
      ليس لديك حساب؟ <a href="/signup" class="text-blue-400 font-bold hover:underline">إنشاء حساب جديد</a>
    </p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('identifier').value;
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ identifier, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          alertBox.className = 'mb-4 p-3 rounded-xl text-sm bg-green-500/10 border border-green-500/20 text-green-400';
          alertBox.textContent = 'تم تسجيل الدخول بنجاح! جاري التحويل...';
          alertBox.classList.remove('hidden');

          setTimeout(() => {
            if (data.user.role === 'admin') window.location.href = '/dashboard/admin';
            else if (data.user.role === 'editor') window.location.href = '/dashboard/editor';
            else window.location.href = '/dashboard/client';
          }, 800);
        } else {
          alertBox.className = 'mb-4 p-3 rounded-xl text-sm bg-red-500/10 border border-red-500/20 text-red-400';
          alertBox.textContent = data.message || 'بيانات الدخول غير صحيحة';
          alertBox.classList.remove('hidden');
        }
      } catch (err) {
        alertBox.className = 'mb-4 p-3 rounded-xl text-sm bg-red-500/10 border border-red-500/20 text-red-400';
        alertBox.textContent = 'حدث خطأ في الاتصال بالسيرفر';
        alertBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
