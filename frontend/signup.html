<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حساب جديد — ChromaProduction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-bold text-2xl mx-auto shadow-lg shadow-blue-500/20 mb-4">CP</div>
      <h2 class="text-2xl font-bold text-white">إنشاء حساب جديد</h2>
      <p class="text-slate-400 text-sm mt-1">انضم لمنظومة ChromaProduction الذكية</p>
    </div>

    <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-sm"></div>

    <form id="signupForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-1.5">اسم المستخدم</label>
        <input type="text" id="username" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-blue-500 transition">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-1.5">البريد الإلكتروني</label>
        <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-blue-500 transition">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-1.5">رقم الهاتف (واتساب)</label>
        <input type="text" id="phone" placeholder="010xxxxxxxx" class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-blue-500 transition">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-1.5">نوع الحساب</label>
        <select id="role" class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-blue-500 transition">
          <option value="client">عميل (صانع محتوى / شركة / طالب خدمة)</option>
          <option value="editor">مونتير ومصمم (محرر فيديو)</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-1.5">كلمة المرور</label>
        <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-blue-500 transition">
      </div>
      <button type="submit" class="w-full py-3.5 rounded-xl font-bold bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-600/30 transition mt-2">
        إنشاء الحساب
      </button>
    </form>

    <p class="text-center text-sm text-slate-400 mt-6">
      لديك حساب بالفعل؟ <a href="/login" class="text-blue-400 font-bold hover:underline">تسجيل الدخول</a>
    </p>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const role = document.getElementById('role').value;
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username, email, phone, role, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          alertBox.className = 'mb-4 p-3 rounded-xl text-sm bg-green-500/10 border border-green-500/20 text-green-400';
          alertBox.textContent = 'تم إنشاء الحساب بنجاح! جاري التحويل...';
          alertBox.classList.remove('hidden');

          setTimeout(() => {
            if (data.user.role === 'editor') window.location.href = '/dashboard/editor';
            else window.location.href = '/dashboard/client';
          }, 800);
        } else {
          alertBox.className = 'mb-4 p-3 rounded-xl text-sm bg-red-500/10 border border-red-500/20 text-red-400';
          alertBox.textContent = data.message || 'حدث خطأ أثناء التسجيل';
          alertBox.classList.remove('hidden');
        }
      } catch (err) {
        alertBox.className = 'mb-4 p-3 rounded-xl text-sm bg-red-500/10 border border-red-500/20 text-red-400';
        alertBox.textContent = 'حدث خطأ في الاتصال بالسيرفر';
        alertBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
